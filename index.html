<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscador de tarifa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna, buscador fijo arriba, resultados como lista agrupada por formato */
:root{
  --bg:#f4f6f9; --surface:#ffffff; --fg:#14181f; --muted:#4a5260; --line:#d3d9e2;
  --accent:#1b4f9c; --accent-soft:#e4edfb; --mark:#ffe08a; --field-line:#5b6573; color-scheme:light;
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header{padding-block:4px 6px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:10px 12px;z-index:5;display:grid;gap:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance;line-height:1.2}
h1 span{display:block;color:var(--muted);font-weight:500;font-size:1rem;margin-top:2px;letter-spacing:0}
.search{position:relative}
#q{caret-color:var(--accent);width:100%;box-sizing:border-box;font:500 1.1rem var(--body);padding:14px 44px 14px 16px;border:2px solid var(--field-line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q::placeholder{color:var(--muted);opacity:1}
#q::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none;display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;width:40px;height:40px;border-radius:8px}
#clear:hover{color:var(--fg)}
#clear:focus-visible{outline:2px solid var(--accent)}
.count{font-size:1rem;color:var(--muted)}
.group{margin-top:22px}
.group h2{font-family:var(--display);font-weight:700;font-size:.95rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 8px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.info{min-width:0;display:grid;gap:4px}
.name{font-weight:600;font-size:1.15rem;line-height:1.3;overflow-wrap:anywhere}
.code{font-family:var(--mono);font-size:1.15rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--body);font-weight:500;font-size:.95rem;color:var(--muted);margin-right:6px}
.price{font-family:var(--mono);font-weight:700;font-size:1.35rem;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tab,.btn{font:600 1.05rem var(--body);padding:12px 14px;border:1.5px solid var(--field-line);border-radius:10px;background:transparent;color:var(--fg);cursor:pointer}
.tab[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tab:focus-visible,.btn:focus-visible,.add:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side{display:grid;gap:8px;justify-items:end}
.add{height:44px;padding:0 16px;border-radius:22px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:700 1rem var(--body);cursor:pointer;white-space:nowrap}
.step{display:flex;align-items:center;border:2px solid var(--accent);border-radius:22px;background:var(--accent-soft);height:44px}
.step button{width:44px;height:100%;border:0;background:transparent;color:var(--fg);font:600 1.4rem/1 var(--body);cursor:pointer;border-radius:20px}
.step output{min-width:2ch;text-align:center;font:700 1.25rem var(--mono);font-variant-numeric:tabular-nums}
.step button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.total{display:grid;gap:10px;margin-top:18px;padding:14px 16px;background:var(--accent-soft);border:2px solid var(--accent);border-radius:10px}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.trow+.trow{border-top:1px solid var(--accent);padding-top:10px}
.total span{font-weight:700;font-size:1.15rem}.total small{color:var(--muted);font-weight:500;font-size:.95rem;margin-left:6px}
.total strong{font:700 1.4rem var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.total .trow+.trow strong{font-size:1.8rem}
.favform{margin-top:22px;display:grid;gap:8px}
.favform label{font-weight:700;font-size:1.1rem}
.favrow{display:flex;gap:8px}
.favrow input{flex:1;min-width:0;font:500 1.1rem var(--body);padding:12px 14px;border:2px solid var(--field-line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
.favrow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn.wa{background:#1a7f43;border-color:#1a7f43;color:#fff;flex:1 1 100%;display:block;text-align:center;text-decoration:none;box-sizing:border-box}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
li.fav{grid-template-columns:minmax(0,1fr);gap:10px}
.favtxt{display:grid;gap:2px}.lbl2{color:var(--muted);font-size:1rem}
.favbtns{display:flex;gap:8px;flex-wrap:wrap}
.note{margin:0 0 8px;font-weight:700;color:var(--accent)}.note:empty{display:none}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn[data-armed]{border-color:#a11d1d;color:#a11d1d}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{margin-top:40px;text-align:center;color:var(--muted)}
</style>
</head>

function hl(text, terms){
  if(!terms.length) return esc(text);

  terms.forEach(t=>{let i=0; while((i=n.indexOf(t,i))>-1){for(let k=i;k<i+t.length;k++)marks[k]=true; i+=t.length;}});

  const inLista = view==="lista";
  searchBox.hidden = inLista;
  tabT.setAttribute("aria-pressed", String(!inLista)); tabL.setAttribute("aria-pressed", String(inLista));
  const hits = inLista ? ROWS.filter(r=>qty(key(r)))
                       : ROWS.filter((r,i)=>terms.every(t=>idx[i].includes(t)));
  count.textContent = inLista ? `${hits.length} ${hits.length===1?"producto":"productos"} · ${units} ${units===1?"unidad":"unidades"}`
    : terms.length ? `${hits.length} de ${ROWS.length} productos` : `${ROWS.length} productos`;
  if(inLista && !hits.length){ out.innerHTML = `<p class="empty">Tu lista está vacía. En Bebidas, pulsa «+ Añadir» junto a un producto, o carga una favorita.</p>` + favsHTML(); return; }
  if(!hits.length){ out.innerHTML = `<p class="empty">Nada coincide con «${esc(q.value)}». Prueba con menos letras.</p>`; return; }
  const groups = new Map();
  hits.forEach(r=>{ if(!groups.has(r[0])) groups.set(r[0],[]); groups.get(r[0]).push(r); });
  let h="";
  groups.forEach((items,fmt)=>{
    h += `<section class="group"><h2>${hl(fmt,terms)}</h2><ul>` +
      items.map(r=>rowHTML(r,terms)).join("") +
      `</ul></section>`;
  });
  if(!inLista && !terms.length) h = `<section class="group"><h2>Más pedidos</h2><ul>${topRows.map(r=>rowHTML(r,terms,true)).join("")}</ul></section>` + h;
  if(inLista) h += `<div class="actions"><a class="btn wa" id="wa" href="https://wa.me/34637889942" target="_blank" rel="noopener">Enviar por WhatsApp</a><button class="btn" id="copy" type="button">Copiar lista</button><button class="btn" id="empty" type="button">Vaciar lista</button></div>`;
  out.innerHTML = (inLista ? totalHTML() : "") + h + (inLista ? favsHTML() : "");
  updateWa();
}
out.addEventListener("click", e=>{
  const b = e.target.closest("[data-a]");
  if(b){
    const k = b.dataset.k, a = b.dataset.a;
    const n = Math.max(0, qty(k) + (a==="inc" ? 1 : -1));
    if(n) lista[k]=n; else delete lista[k];
    save();
    if(view==="lista" && !n) return render();
    const box = b.closest(".ctl");
    out.querySelectorAll(".ctl").forEach(x=>{ const bt = x.querySelector("[data-k]"); if(bt && bt.dataset.k===k) x.innerHTML = ctl(k, x.dataset.name); });
    (box.querySelector('[data-a="'+a+'"]') || box.querySelector("button")).focus();
    nEl.textContent = Object.values(lista).reduce((x,y)=>x+y,0);
    if(view==="lista"){ { const t=totals(); document.getElementById("total-sin").textContent = eurT(t.sin); document.getElementById("total-con").textContent = eurT(t.con); } updateWa(); const u = Object.values(lista).reduce((x,y)=>x+y,0), p = Object.keys(lista).length; count.textContent = `${p} ${p===1?"producto":"productos"} · ${u} ${u===1?"unidad":"unidades"}`; }
    return;
  }
  const fv = e.target.closest("[data-f]");
  if(fv){
    const a = fv.dataset.f, i = +fv.dataset.i;
    const note = t => { const n=document.getElementById("fav-note"); if(n){ n.textContent=t; n.scrollIntoView({block:"nearest"}); } };
    if(a==="save"){
      const inp = document.getElementById("fav-name"), name = inp.value.trim().slice(0,40);
      if(!name){ note("Escribe un nombre para guardarla."); inp.focus(); return; }
      const entry = {name, items:Object.assign({},lista)}, j = favs.findIndex(f=>f.name.toLowerCase()===name.toLowerCase());
      if(j>-1) favs[j]=entry; else favs.push(entry);
      saveFavs(); render(); note("«"+name+(j>-1?"» actualizada ✓":"» guardada ✓")); return;
    }
    if(a==="del"){
      if(!fv.dataset.armed){ arm(fv,"Pulsa otra vez para borrar","Borrar"); return; }
      favs.splice(i,1); saveFavs(); render(); return;
    }
    if(a==="load"){
      if(Object.keys(lista).length && !fv.dataset.armed){ arm(fv,"Pulsa otra vez: reemplaza tu lista","Cargar"); return; }
      const ok = new Set(ROWS.map(key));
      lista = {}; Object.keys(favs[i].items).forEach(k=>{ if(ok.has(k) && favs[i].items[k]>0) lista[k]=favs[i].items[k]; });
      save(); render(); window.scrollTo(0,0); return;
    }
  }
  const c = e.target.closest("#copy");
  if(c){
    const txt = listText();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>{c.textContent="Copiado ✓"}, ()=>{c.textContent="No se pudo copiar"});
    setTimeout(()=>{c.textContent="Copiar lista"},2000);
    return;
  }
  const m = e.target.closest("#empty");
  if(m){
    if(!m.dataset.armed){ m.dataset.armed="1"; m.textContent="Pulsa otra vez para vaciar"; setTimeout(()=>{ if(m.isConnected){ delete m.dataset.armed; m.textContent="Vaciar lista"; } },3000); return; }
    lista={}; save(); render();
  }
});
out.addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.id==="fav-name"){ e.preventDefault(); document.querySelector('[data-f="save"]').click(); } });
tabT.addEventListener("click", ()=>{ view="tarifa"; render(); window.scrollTo(0,0); });
tabL.addEventListener("click", ()=>{ view="lista"; render(); window.scrollTo(0,0); });
q.addEventListener("input", render);
clear.addEventListener("click", ()=>{ q.value=""; render(); q.focus(); });
render();
</script>
