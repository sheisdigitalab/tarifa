<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Buscador de tarifa</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: una columna, buscador fijo arriba, resultados como lista agrupada por formato */
:root{
  --bg:#0d1117; --surface:#161c26; --fg:#e8ecf2; --muted:#8d97a6; --line:#273041;
  --accent:#9fb3cf; --accent-soft:#1f2836; --mark:#5c470c; --field-line:#6b7686; color-scheme:dark;
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:12px 14px;z-index:5;display:grid;gap:10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{color:var(--muted);font-weight:500;font-size:.9rem;margin-left:8px;letter-spacing:0}
.search{position:relative}
#q{caret-color:var(--accent);width:100%;box-sizing:border-box;font:500 1.1rem var(--body);padding:14px 44px 14px 16px;border:2px solid var(--field-line);border-radius:10px;background:var(--surface);color:var(--fg);outline:none}
#q:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
#q::placeholder{color:var(--muted);opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);font-size:1.3rem;cursor:pointer;width:40px;height:40px;border-radius:8px}
#clear:hover{color:var(--fg)}
#clear:focus-visible{outline:2px solid var(--accent)}
.count{font-size:.85rem;color:var(--muted)}
.group{margin-top:22px}
.group h2{font-family:var(--display);font-weight:700;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin:0 0 6px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:baseline;padding:10px 14px;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.name{min-width:0}
.code{font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.price{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;min-width:5.5ch;text-align:right}
mark{background:var(--mark);color:inherit;border-radius:2px}
.empty{margin-top:40px;text-align:center;color:var(--muted)}
</style>
</head>
<body style="margin:0">
<div class="wrap">
  <header>
    <h1>Tarifa de bebidas<span>precios con IVA · rev. 03/24</span></h1>
    <div class="search">
      <input id="q" type="search" autocomplete="off" placeholder="Busca por nombre, código o formato… (ej. fanta, 2548, latas 33)" aria-label="Buscar en la tarifa">
      <button id="clear" type="button" aria-label="Borrar búsqueda" hidden>×</button>
    </div>
    <div class="count" id="count" role="status" aria-live="polite"></div>
  </header>
  <main id="out"></main>
</div>
<script>
document.documentElement.lang = "es";
const ROWS = [["Latas 33 cl. cj.24 lat.", "Coca Cola", "80", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Sin cafeína", "87", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Light", "88", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Light s/cafeína", "2601", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Light limón", "2604", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Zero", "2621", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Zero Zero", "2706", 5.09], ["Latas 33 cl. cj.24 lat.", "Coca-Cola Zero Limón", "2595", 5.09], ["Latas 33 cl. cj.24 lat.", "Cherry Coke Zero", "1482", 6.05], ["Latas 33 cl. cj.24 lat.", "Fanta Naranja", "81", 5.09], ["Latas 33 cl. cj.24 lat.", "Fanta Limón", "82", 5.09], ["Latas 33 cl. cj.24 lat.", "Fanta Zero Naranja", "3107", 5.09], ["Latas 33 cl. cj.24 lat.", "Fanta Zero Limón", "3207", 5.09], ["Latas 33 cl. cj.24 lat.", "Sprite", "2555", 5.09], ["Latas 33 cl. cj.24 lat.", "Sprite Zero", "316313", 5.09], ["Latas 33 cl. cj.24 lat.", "Aquarius", "84", 6.11], ["Latas 33 cl. cj.24 lat.", "Aquarius Libre", "3489", 6.11], ["Latas 33 cl. cj.24 lat.", "Aquarius Naranja", "2409", 6.11], ["Latas 33 cl. cj.24 lat.", "Aquarius Naranja Libre", "3490", 6.11], ["Latas 33 cl. cj.24 lat.", "Nestea Limón", "89", 6.11], ["Latas 33 cl. cj.24 lat.", "Nestea Limón s/azúcar", "3113", 6.11], ["Latas 33 cl. cj.24 lat.", "Nestea Té Verde Manzana", "2781", 7.38], ["Latas 33 cl. cj.24 lat.", "Nestea Té Verde Maracuyá", "372784", 7.38], ["Latas 33 cl. cj.12 lat.", "Fanta Zero Uva", "2310", 8.71], ["Latas 33 cl. cj.12 lat.", "Fanta Zero Piña", "2420", 3.32], ["Latas 33 cl. cj.12 lat.", "Fanta Zero Frambuesa", "2425", 3.47], ["300 cl. Retornable cj.24 bot.", "Aquarius Naranja", "223", 6.64], ["300 cl. Retornable cj.24 bot.", "Aquarius", "224", 6.55], ["PET 60 cj.12 bot.", "Smartwater", "4105", 3.96], ["PET 50 cj.24 bot.", "Aquarius", "2427", 11.65], ["PET 50 cj.24 bot.", "Aquarius Naranja", "2411", 11.8], ["PET 1L cj.12 bot.", "Aquarius", "2428", 9.16], ["PET 1L cj.12 bot.", "Aquarius Naranja", "2410", 9.29], ["PET 1,5 L cj.6 bot.", "Aquarius", "3458", 5.11], ["PET 1,5 L cj.6 bot.", "Aquarius Naranja", "3478", 5.22], ["PET 1,5 L cj.6 bot.", "Aquarius Libre", "3491", 6.5], ["PET 1,5 L cj.6 bot.", "Aquarius Naranja Libre", "3492", 6.5], ["Aquabona", "Aquabona Singular VR365 cc cj.20 bot.", "3549", 3.14], ["Aquabona", "Aquabona VR50 cj.20 bot.", "4081", 9.02], ["Aquabona", "Aquabona VR1L cj.12 bot.", "4091", 7.48], ["Aquabona", "Aquabona PET 350 cc cj.24 bot.", "4000", 2.11], ["Aquabona", "Aquabona Moonlight PET 350 cc cj.24 bot.", "4030", 3.7], ["Aquabona", "Aquabona PET 50 cc cj.24 bot.", "4052", 2.74], ["Aquabona", "Aquabona Singular PET 50 cj.12 bot.", "4095", 3.32], ["Aquabona", "Aquabona Singular PET 1,25 L cj.6 bot.", "4009", 2.92], ["Aquabona", "Aquabona PET 1,5 litros pack 6", "4054", 0.87], ["Vilas del Turbón", "Vilas PET 50 cc cj.24 bot.", "7495", 4.4], ["Vilas del Turbón", "Vilas PET 1 litro caja 6", "7496", 1.32], ["Vilas del Turbón", "Vilas VNR33 cj.24 bot.", "7486", 9.52], ["Vilas del Turbón", "Vilas VNR75 cl. cj.6 bot.", "7470", 3.91], ["Bolsa 200 cj.4", "Capri Sun Safari", "4247", 0.97], ["Bolsa 200 cj.10", "Capri Sun Fruit Crush Tropical", "4242", 3.03], ["Bolsa 200 cj.10", "Capri Sun FC Raspberry Strawberry", "4243", 3.03], ["Bolsa 330 cj.15", "Capri Sun Orange-Peach", "4241", 6.72], ["Bolsa 330 cj.15", "Capri Sun Mango-Passion Fruit", "4244", 6.72], ["Latas 25 cl. cj.24 lat.", "Burn", "4174", 11.04], ["Latas 25 cl. cj.24 lat.", "Nordic Tónica", "2334", 3.85], ["Latas 25 cl. cj.24 lat.", "Nordic Tónica Zero", "2307", 3.85], ["Latas 25 cl. cj.24 lat.", "Nordic Blue Tónica", "2372", 3.85], ["Latas 25 cl. cj.24 lat.", "Monster Energy", "4154", 15.39], ["Latas 20 cl. Pack 6 lat. (Minican)", "Coca Cola", "2993", 1.65], ["Latas 20 cl. Pack 6 lat. (Minican)", "Coca-Cola Light", "2994", 1.48], ["Latas 20 cl. Pack 6 lat. (Minican)", "Coca-Cola Zero", "2995", 1.71], ["Latas 20 cl. Pack 6 lat. (Minican)", "Coca-Cola Zero Zero", "2996", 1.77], ["Latas 20 cl. Pack 6 lat. (Minican)", "Fanta Naranja", "2997", 1.51], ["Latas 20 cl. Pack 6 lat. (Minican)", "Fanta Limón", "2999", 1.4], ["Latas 20 cl. Pack 6 lat. (Minican)", "Sprite", "2998", 1.28], ["Latas 25 cl. Slim cj.12 lat.", "Coca-Cola Energy Zero Cherry", "2591", 8.71], ["Latas 25 cl. Slim cj.12 lat.", "Coca-Cola Plus Coffee s/az.", "2793", 3.98], ["Latas 25 cl. Slim cj.12 lat.", "Coca-Cola Energy", "2794", 7.39], ["Latas 25 cl. Slim cj.12 lat.", "Coca-Cola Energy Zero", "2795", 7.39], ["Latas 25 cl. Slim cj.12 lat.", "Appletiser Manzana", "4291", 6.25], ["Latas 25 cl. Slim cj.12 lat.", "Royal Bliss Berry Lata25 C12", "3625", 5.05], ["Latas 25 cl. Slim cj.12 lat.", "Royal Bliss Yuzu Lata25 C12", "3626", 5.05], ["Latas 25 cl. Slim cj.12 lat.", "Royal Bliss Yuzu Zero Lata25 C12", "3627", 5.05], ["Latas 25 cl. Slim cj.12 lat.", "Royal Bliss Lim Mix Lata25 C12", "3628", 5.05], ["Latas 50 cl. cj.12 lat. (Burn)", "Burn", "4170", 11.69], ["Latas 50 cl. cj.12 lat. (Burn)", "Burn Apple Kiwi", "4171", 5.2], ["Latas 50 cl. cj.12 lat. (Burn)", "Burn Lemon Ice", "4172", 5.2], ["Latas 50 cl. cj.12 lat. (Burn)", "Burn Zero", "4173", 5.2], ["Latas 50 cl. cj.12 lat. (Monster Reign)", "Monster Reign Lemon", "4096", 11.04], ["Latas 50 cl. cj.12 lat. (Monster Reign)", "Monster Reign Melon Mania", "4097", 11.04], ["Latas 50 cl. cj.12 lat. (Monster Reign)", "Monster Reign Razzle Berry", "4098", 11.04], ["Latas 50 cl. cj.12 lat. (Monster Reign)", "Monster Reign Sour Apple", "4099", 11.04], ["Latas 50 cl. cj.24 lat.", "Monster Ultra Paradise", "3175", 17.96], ["Latas 50 cl. cj.24 lat.", "Monster Pacific Punch", "3176", 17.93], ["Latas 50 cl. cj.24 lat.", "Monster Energy", "4151", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster AB. Zero", "4155", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Ripper", "4157", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Assault", "4160", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Rehab Lemon", "4162", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Ultra Red", "4180", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Ultra Sun", "4181", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Rossi", "4182", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Ultra White Zero", "4183", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Lewis Hamilton", "4187", 18.59], ["Latas 50 cl. cj.24 lat.", "Monster Mango Loco", "4210", 14.52], ["Latas 553 cl. cj.12 lat.", "Monster Energy", "4150", 10.6]];
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const idx = ROWS.map(r => norm(r[0]+" "+r[1]+" "+r[2]));
const q = document.getElementById("q"), out = document.getElementById("out"),
      count = document.getElementById("count"), clear = document.getElementById("clear");
const eur = n => n.toLocaleString("es-ES",{minimumFractionDigits:2,maximumFractionDigits:3})+" €";
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function hl(text, terms){
  if(!terms.length) return esc(text);
  const n = norm(text); const marks = new Array(text.length).fill(false);
  terms.forEach(t=>{let i=0; while((i=n.indexOf(t,i))>-1){for(let k=i;k<i+t.length;k++)marks[k]=true; i+=t.length;}});
  let h="",open=false;
  for(let i=0;i<text.length;i++){ if(marks[i]&&!open){h+="<mark>";open=true} if(!marks[i]&&open){h+="</mark>";open=false} h+=esc(text[i]); }
  return h+(open?"</mark>":"");
}
function render(){
  const terms = norm(q.value).split(/\s+/).filter(t=>t && !["de","del","la","el","los","las","y"].includes(t));
  clear.hidden = !q.value;
  const hits = ROWS.filter((r,i)=>terms.every(t=>idx[i].includes(t)));
  count.textContent = terms.length ? `${hits.length} de ${ROWS.length} productos` : `${ROWS.length} productos`;
  if(!hits.length){ out.innerHTML = `<p class="empty">Nada coincide con «${esc(q.value)}». Prueba con menos letras.</p>`; return; }
  const groups = new Map();
  hits.forEach(r=>{ if(!groups.has(r[0])) groups.set(r[0],[]); groups.get(r[0]).push(r); });
  let h="";
  groups.forEach((items,fmt)=>{
    h += `<section class="group"><h2>${hl(fmt,terms)}</h2><ul>` +
      items.map(r=>`<li><span class="name">${hl(r[1],terms)}</span><span class="code"><span class="sr">código </span>${hl(r[2],terms)}</span><span class="price"><span class="sr">precio </span>${eur(r[3])}</span></li>`).join("") +
      `</ul></section>`;
  });
  out.innerHTML = h;
}
q.addEventListener("input", render);
clear.addEventListener("click", ()=>{ q.value=""; render(); q.focus(); });
render();
</script>
